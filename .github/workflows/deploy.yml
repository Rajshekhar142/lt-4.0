name: CI/CD

on:
  push:
    branches: [tdevops]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies on CI runner
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NODE_ENV: production

      - name: Package standalone build
        run: |
          # 1. Clean any old artifacts
          rm -rf deploy-package deploy.tar.gz

          # 2. Create target directory tree
          mkdir -p deploy-package/.next

          # 3. Copy standalone server and minimal dependencies
          cp -r .next/standalone/* deploy-package/

          # 4. Copy static frontend chunks into .next/static
          cp -r .next/static deploy-package/.next/

          # 5. Copy public folder if it exists
          if [ -d "public" ]; then
            cp -r public deploy-package/
          fi

          # 6. Copy ecosystem config if it exists
          if [ -f "ecosystem.config.js" ]; then
            cp ecosystem.config.js deploy-package/
          fi

          # 7. Compress bundle
          tar -czf deploy.tar.gz -C deploy-package .

      - name: Copy bundle to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "~/lt-4.0"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/lt-4.0

            # Extract over existing files without running npm or build
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz

            # Reload PM2 cleanly using the standalone server
            pm2 startOrReload ecosystem.config.js || pm2 restart lifetracker --update-env