name: CI/CD
on:
  push:
    branches: [tdevops]

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Use npm 11.6.2
        run: npm install -g npm@11.6.2
      - name: Install dependencies
        run: npm ci
      - name: Build (this is the actual check — fails on type errors, bad imports, etc.)
        run: npm run build
      - name: Package release artifact
        run: tar -czf release.tar.gz .next package.json package-lock.json next.config.ts
      - name: Upload build artifact for deploy job
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload release to S3
        run: |
          aws s3 cp release.tar.gz s3://${{ secrets.ARTIFACT_BUCKET_NAME }}/releases/release-${{ github.sha }}.tar.gz

      - name: Trigger deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="['bash /home/ubuntu/lt-4.0/deploy.sh releases/release-${{ github.sha }}.tar.gz']" \
            --query "Command.CommandId" --output text)
          echo "SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" --output text)
          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" --output text)

          echo "$OUTPUT"
          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed with status: $STATUS"
            exit 1
          fi