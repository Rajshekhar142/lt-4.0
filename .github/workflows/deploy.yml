name: CI/CD
on:
  push:
    branches: [tdevops]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Use npm 11.6.2
        run: npm install -g npm@11.6.2
      - name: Install dependencies
        run: npm ci
      - name: Build (this is the actual check — fails on type errors, bad imports, etc.)
        run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/lt-4.0

            # Wipe uncommitted changes (fixes package-lock.json drift)
            git reset --hard HEAD
            # Clean untracked generated files
            git clean -fd

            # Pull remote changes (which deletes vault/vault.js)
            git pull origin tdevops

            # Clean install using the exact repo lockfile
            npm ci || npm install

            pm2 stop lifetracker || true
            npm run build
            pm2 restart lifetracker